<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="./css/main.css" />
		<script type="application/javascript" src="./js/qrcode.min.js"></script>
		<script
			type="application/javascript"
			src="./js/jquery-3.7.1.min.js"
		></script>
		<script type="module" src="./js/main.js"></script>
		<title>Store Pass</title>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
		/>
	</head>
	<body>
		<div class="main">
			<div class="field pass">
				<label for="mainPass" data-i18n="mainPassLabel">Master password:</label>
				<div class="content">
					<input type="password" id="mainPass" />
					<button class="toggle">
						<img src="./img/eye-open.svg" class="hidden" />
						<img src="./img/eye-closed.svg" />
					</button>
					<button id="saveMainPass" title="Save in this browser" data-i18n-title="saveInBrowser">
						<img src="./img/save.svg" />
						<img src="./img/check.svg" class="hidden" />
					</button>
				</div>
			</div>
			<div class="field pass">
				<label for="pass" data-i18n="passLabel">Password:</label>
				<div class="content">
					<input type="password" id="pass" />
					<button class="toggle">
						<img src="./img/eye-open.svg" class="hidden" />
						<img src="./img/eye-closed.svg" />
					</button>
					<button class="copy" data-target="#pass" title="Copy" data-i18n-title="copy">
						<img src="./img/copy.svg" />
						<img src="./img/check.svg" class="hidden" />
					</button>
				</div>
			</div>
			<div class="field">
				<label for="encrypted" data-i18n="encryptedLabel">Code:</label>
				<div class="content">
					<textarea id="encrypted"></textarea>
					<div id="qr" style="display: none"></div>
					<button class="copy" data-target="#encrypted" title="Copy" data-i18n-title="copy">
						<img src="./img/copy.svg" />
						<img src="./img/check.svg" class="hidden" />
					</button>
				</div>
			</div>
			<div class="buttons">
				<select id="option">
					<option value="text" data-i18n="text">Text</option>
					<option value="link" data-i18n="link">Link</option>
					<option value="qr" data-i18n="qrCode">QR Code</option>
				</select>
				<button id="encrypt" data-i18n="encrypt">Generate code</button>
				<button id="decrypt" data-i18n="decrypt">Translate code</button>
			</div>
		</div>
	</body>
</html>
